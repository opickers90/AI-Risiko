{% extends "ai_risiko/base.html" %}

{% load crispy_forms_tags i18n %}

{% block title %}{{ user.username }}  - {{ block.super }}{% endblock %}

{% block content %}
<section class="row">
  <div class="col-12">
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <h1>{{ user.username }}</h1>
            <form class="form-horizontal" method="post" action="{% url 'users:update' %}">
              {% csrf_token %}
              {{ form|crispy }}
              <div class="control-group">
                <div class="controls">
                  <button type="submit" class="btn btn-primary">{% translate "Update" %}</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
