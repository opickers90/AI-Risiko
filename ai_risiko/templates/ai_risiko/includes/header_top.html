{% load static i18n %}

<div class="header-top">
  <div class="container">
    <div class="logo">
      <a class="navbar-brand" href="#">AI Risiko</a>
      <!--
      <a href="#">
        <img src="{% static 'vendors/mazer/assets/images/logo/logo.svg' %}" alt="Logo"/>
      </a>
      -->
    </div>
    <div class="header-top-right">
      {% if request.user.is_authenticated %}
      <div class="dropdown">
        <a
          href="#"
          id="topbarUserDropdown"
          class="user-dropdown d-flex align-items-center dropend dropdown-toggle"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <div class="avatar avatar-md2">
            <img src="{% static 'vendors/mazer/assets/images/faces/2.jpg' %}" alt="Avatar" />
          </div>
          <div class="text">
            <h6 class="user-dropdown-name">{{ request.user.username }}</h6>
            <p class="user-dropdown-status text-sm text-muted">
              {% if request.user.is_superuser %}
              {% translate "Admin" %}
              {% else %}
              {% translate "Member" %}
              {% endif %}
            </p>
          </div>
        </a>
        <ul
          class="dropdown-menu dropdown-menu-end shadow-lg"
          aria-labelledby="topbarUserDropdown"
        >
          <li><a class="dropdown-item" href="{% url 'users:detail' request.user.username  %}">{% translate "My Profile" %}</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <a class="dropdown-item" href="{% url 'account_logout' %}">{% translate "Sign Out" %}</a>
          </li>
        </ul>
      </div>
      {% endif %}

      <!-- Burger button responsive -->
      <a href="#" class="burger-btn d-block d-xl-none">
        <i class="bi bi-justify fs-3"></i>
      </a>
    </div>
  </div>
</div>
